<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Concentric Ambient Pulse Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(234,88,12,0.18)" stroke-width="8"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(234,88,12,0.25)" stroke-width="6"/>

  <!-- Center Emblem Badge -->
  <circle cx="256" cy="256" r="135" fill="url(#orangeGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="135" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>

  <!-- High-Tech Download Arrow -->
  <!-- Vertical Stem -->
  <rect x="244" y="195" width="24" height="75" rx="7" fill="#FFFFFF"/>
  <!-- Chevron Head -->
  <path d="M256 315 L200 258 Q194 252 202 252 L225 252 L256 284 L287 252 L310 252 Q318 252 312 258 Z" fill="#FFFFFF"/>
  <!-- Speed Bracket Tray -->
  <rect x="180" y="336" width="152" height="18" rx="9" fill="#FFFFFF"/>
</svg>